name: Cloudflare Workers
on:
  pull_request:
  push:
    branches: [main, feat/cloudflare-workers]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the tested version to Cloudflare
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:workers
      - run: npm run test:workers
      - run: npm run build
      - run: node --test tests/managerRegistrationApi.test.mjs tests/scopedWorkspaceApi.test.mjs tests/executiveApi.test.mjs
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: validate
    runs-on: ubuntu-latest
    environment: cloudflare-production
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/configure-cloudflare.mjs
      - run: node scripts/cloudflare-secrets.mjs
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ARAAK_AUTH_USERS: ${{ secrets.ARAAK_AUTH_USERS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      - run: npm run deploy:workers
